<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortune Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loading-screen">
    <div class="loader-spinner"></div>
    <p>Conectando à sala...</p>
  </div>

  <div id="app" class="hidden">

    <header id="header">
      <h1>🎰 Fortune Table</h1>
      <div id="header-controls">
        <button id="btn-toggle-sound" title="Som">🔊</button>
        <button id="btn-toggle-anim" title="Animações">✨</button>
      </div>
    </header>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="roulette">🎡 Roleta</button>
      <button class="tab-btn" data-tab="slots">🎰 Slots</button>
      <button class="tab-btn" data-tab="coinflip">🪙 Moeda</button>
    </nav>

    <section id="tab-roulette" class="tab-content active">
      <div id="roulette-container">
        <div id="roulette-pointer">▼</div>
        <canvas id="roulette-canvas" width="300" height="300"></canvas>
      </div>
      <div id="roulette-result" class="result-box">Gire a roleta!</div>
      <button id="btn-spin-roulette" class="btn-primary">🎡 Girar</button>
      <div id="roulette-gm-panel" class="gm-panel hidden">
        <h3>⚙️ GM — Opções da Roleta</h3>
        <label>Opções (uma por linha):</label>
        <textarea id="roulette-items-input" rows="6"
          placeholder="Guerreiro&#10;Mago&#10;Ladino"></textarea>
        <button id="btn-save-roulette-items" class="btn-secondary">💾 Salvar</button>
      </div>
      <div class="history-section">
        <h4>📜 Histórico</h4>
        <ul id="roulette-history"></ul>
        <button id="btn-clear-roulette-history" class="btn-small">🗑️ Limpar</button>
      </div>
    </section>

    <section id="tab-slots" class="tab-content hidden">
      <div id="slots-machine">
        <div class="slot-reel" id="reel-0"><div class="slot-symbol">🍒</div></div>
        <div class="slot-reel" id="reel-1"><div class="slot-symbol">🍒</div></div>
        <div class="slot-reel" id="reel-2"><div class="slot-symbol">🍒</div></div>
      </div>
      <div id="slots-result" class="result-box">Puxe a alavanca!</div>
      <button id="btn-pull-slots" class="btn-primary">🎰 Puxar</button>
      <div id="slots-gm-panel" class="gm-panel hidden">
        <h3>⚙️ GM — Chance de Vitória</h3>
        <label>Chance: <strong><span id="slots-win-chance-label">30</span>%</strong></label>
        <input type="range" id="slots-win-chance" min="0" max="100" value="30" />
        <button id="btn-save-slots-config" class="btn-secondary">💾 Salvar</button>
        <p class="gm-note">⚠️ Jogadores não veem isso.</p>
      </div>
      <div class="history-section">
        <h4>📜 Histórico</h4>
        <ul id="slots-history"></ul>
        <button id="btn-clear-slots-history" class="btn-small">🗑️ Limpar</button>
      </div>
    </section>

    <section id="tab-coinflip" class="tab-content hidden">
      <div id="coin-container">
        <div id="coin">
          <div id="coin-front" class="coin-face">👑</div>
          <div id="coin-back" class="coin-face">🌿</div>
        </div>
      </div>
      <div id="coinflip-result" class="result-box">Jogue a moeda!</div>
      <button id="btn-flip-coin" class="btn-primary">🪙 Jogar</button>
      <div class="history-section">
        <h4>📜 Histórico</h4>
        <ul id="coinflip-history"></ul>
        <button id="btn-clear-coinflip-history" class="btn-small">🗑️ Limpar</button>
      </div>
    </section>

  </div>

  <script src="owlbear-rodeo-sdk.umd.js"></script>
  <script src="utils.js"></script>
  <script src="audio.js"></script>
  <script src="sync.js"></script>
  <script src="roulette.js"></script>
  <script src="slots.js"></script>
  <script src="coinflip.js"></script>
  <script src="main.js"></script>

</body>
</html>
