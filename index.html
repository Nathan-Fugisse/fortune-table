<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortune Table</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header with tab navigation -->
    <header id="header">
      <div class="tabs">
        <button class="tab active" data-tab="wheel">🎡 Roleta</button>
        <button class="tab" data-tab="slots">🎰 Caça-níquel</button>
        <button class="tab" data-tab="coin">🪙 Cara/Coroa</button>
      </div>
    </header>

    <!-- ==================== WHEEL TAB ==================== -->
    <section id="tab-wheel" class="tab-content active">
      <div class="game-container">
        <div class="wheel-wrapper">
          <div class="wheel-pointer">▼</div>
          <canvas id="wheelCanvas" width="340" height="340"></canvas>
        </div>
        <div id="wheel-result" class="result-display"></div>
        <button id="wheel-spin-btn" class="btn-primary">🎡 Girar Roleta</button>

        <!-- GM-only config -->
        <div id="wheel-config" class="gm-config hidden">
          <h3>⚙️ Configurações (GM)</h3>
          <label for="wheel-items-input">Itens (um por linha):</label>
          <textarea id="wheel-items-input" rows="8" placeholder="Tesouro&#10;Armadilha&#10;Nada&#10;Monstro&#10;Poção&#10;Ouro"></textarea>
          <button id="wheel-save-config" class="btn-secondary">Salvar Itens</button>
        </div>
      </div>
    </section>

    <!-- ==================== SLOTS TAB ==================== -->
    <section id="tab-slots" class="tab-content">
      <div class="game-container">
        <div class="slots-machine">
          <div class="slots-frame">
            <div class="slot-viewport">
              <div class="slot-reel" id="reel1">
                <div class="slot-symbol">🍒</div>
              </div>
            </div>
            <div class="slot-viewport">
              <div class="slot-reel" id="reel2">
                <div class="slot-symbol">🍒</div>
              </div>
            </div>
            <div class="slot-viewport">
              <div class="slot-reel" id="reel3">
                <div class="slot-symbol">🍒</div>
              </div>
            </div>
          </div>
          <div class="slots-label">🎰 FORTUNE SLOTS 🎰</div>
        </div>
        <div id="slots-result" class="result-display"></div>
        <button id="slots-spin-btn" class="btn-primary">🎰 Puxar Alavanca</button>

        <!-- GM-only config -->
        <div id="slots-config" class="gm-config hidden">
          <h3>⚙️ Configurações (GM)</h3>
          <label for="slots-winrate">Probabilidade de vitória: <span id="slots-winrate-value">25</span>%</label>
          <input type="range" id="slots-winrate" min="0" max="100" value="25" />
          <p class="config-hint">Apenas você vê este controle. Jogadores não sabem a probabilidade.</p>
          <button id="slots-save-config" class="btn-secondary">Salvar Probabilidade</button>
        </div>
      </div>
    </section>

    <!-- ==================== COIN TAB ==================== -->
    <section id="tab-coin" class="tab-content">
      <div class="game-container">
        <div class="coin-stage">
          <div id="coin" class="coin">
            <div class="coin-face coin-heads">
              <span>👑</span>
              <small>CARA</small>
            </div>
            <div class="coin-face coin-tails">
              <span>🌙</span>
              <small>COROA</small>
            </div>
          </div>
        </div>
        <div id="coin-result" class="result-display"></div>
        <button id="coin-flip-btn" class="btn-primary">🪙 Lançar Moeda</button>
      </div>
    </section>

    <!-- Player name display -->
    <footer id="footer">
      <span id="player-info"></span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@latest/dist/index.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
